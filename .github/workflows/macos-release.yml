name: macOS release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  release:
    runs-on: macos-14
    timeout-minutes: 60
    env:
      APPLE_CERTIFICATE_P12_BASE64: ${{ secrets.APPLE_CERTIFICATE_P12_BASE64 }}
      APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    steps:
      - name: Check out tagged source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.23.3
          cache: npm

      - name: Require Apple signing and notarization credentials
        shell: bash
        run: |
          missing=()
          for name in APPLE_CERTIFICATE_P12_BASE64 APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID; do
            if [[ -z "${!name:-}" ]]; then missing+=("$name"); fi
          done
          if (( ${#missing[@]} > 0 )); then
            printf '::error::Missing required Apple release secrets: %s\n' "${missing[*]}"
            exit 1
          fi
          if [[ ! "$APPLE_SIGNING_IDENTITY" =~ ^Developer\ ID\ Application: ]]; then
            echo '::error::APPLE_SIGNING_IDENTITY must be a Developer ID Application identity.'
            exit 1
          fi
          if [[ ! "$APPLE_TEAM_ID" =~ ^[A-Z0-9]{10}$ ]]; then
            echo '::error::APPLE_TEAM_ID must be the 10-character Apple Developer Team ID.'
            exit 1
          fi
          if [[ "${GITHUB_REF_NAME#v}" != "$(node -p "require('./package.json').version")" ]]; then
            echo '::error::Release tag version does not match package.json.'
            exit 1
          fi

      - name: Install locked dependencies
        run: npm ci

      - name: Import Developer ID certificate into temporary keychain
        shell: bash
        run: |
          KEYCHAIN_PATH="$RUNNER_TEMP/siomai-release.keychain-db"
          CERTIFICATE_PATH="$RUNNER_TEMP/siomai-release.p12"
          KEYCHAIN_PASSWORD="$RUNNER_TEMP/siomai-release-keychain"
          echo "$KEYCHAIN_PATH" >> "$GITHUB_ENV"
          echo "$CERTIFICATE_PATH" >> "$GITHUB_ENV"
          echo "$KEYCHAIN_PASSWORD" >> "$GITHUB_ENV"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security default-keychain -s "$KEYCHAIN_PATH"
          printf '%s' "$APPLE_CERTIFICATE_P12_BASE64" | base64 --decode > "$CERTIFICATE_PATH"
          security import "$CERTIFICATE_PATH" -k "$KEYCHAIN_PATH" -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security find-identity -v -p codesigning "$KEYCHAIN_PATH"

      - name: Run unit, integration, renderer, and type checks
        run: |
          npm test
          npm run typecheck
          npm run lint

      - name: Run Electron end-to-end smoke test
        run: npm run test:e2e

      - name: Build the universal app and DMG
        shell: bash
        run: |
          rm -rf out/make
          npm run make:mac
          UNIVERSAL_APP_COUNT=0
          APP_PATH=''
          while IFS= read -r candidate; do
            UNIVERSAL_APP_COUNT=$((UNIVERSAL_APP_COUNT + 1))
            APP_PATH="$candidate"
          done < <(find out -type d -path '*/darwin-universal/Siomai Inventory.app' -prune -print)
          if [[ "$UNIVERSAL_APP_COUNT" -ne 1 ]]; then
            printf '::error::Expected exactly one universal app, found %s.\n' "$UNIVERSAL_APP_COUNT"
            exit 1
          fi
          if [[ ! -f "$APP_PATH/Contents/Resources/app.asar" ]]; then
            echo '::error::The universal app is missing its packaged ASAR.'
            exit 1
          fi
          node scripts/check-package.mjs "$APP_PATH"
          DMG_COUNT=0
          DMG_PATH=''
          while IFS= read -r candidate; do
            DMG_COUNT=$((DMG_COUNT + 1))
            DMG_PATH="$candidate"
          done < <(find out/make -type f -name '*.dmg' -print)
          if [[ "$DMG_COUNT" -ne 1 ]]; then
            printf '::error::Expected exactly one release DMG, found %s.\n' "$DMG_COUNT"
            exit 1
          fi
          echo "RELEASE_APP_PATH=$APP_PATH" >> "$GITHUB_ENV"
          echo "RELEASE_DMG_PATH=$DMG_PATH" >> "$GITHUB_ENV"

      - name: Notarize and staple app and disk image
        shell: bash
        run: |
          APP_PATH="$RELEASE_APP_PATH"
          DMG_PATH="$RELEASE_DMG_PATH"
          xcrun stapler staple "$APP_PATH"
          xcrun notarytool submit "$DMG_PATH" --apple-id "$APPLE_ID" --password "$APPLE_APP_SPECIFIC_PASSWORD" --team-id "$APPLE_TEAM_ID" --wait
          xcrun stapler staple "$DMG_PATH"
          xcrun stapler validate "$APP_PATH"
          xcrun stapler validate "$DMG_PATH"
          codesign --verify --deep --strict --verbose=2 "$APP_PATH"
          spctl --assess --type execute --verbose=4 "$APP_PATH"
          EXECUTABLE="$APP_PATH/Contents/MacOS/Siomai Inventory"
          ARCHS="$(lipo -archs "$EXECUTABLE")"
          [[ " $ARCHS " == *' x86_64 '* && " $ARCHS " == *' arm64 '* ]] || {
            echo "::error::Universal app is missing an architecture: $ARCHS"
            exit 1
          }
          DMG_DIR="$(dirname "$DMG_PATH")"
          DMG_NAME="$(basename "$DMG_PATH")"
          (cd "$DMG_DIR" && shasum -a 256 "$DMG_NAME" > "$DMG_NAME.sha256")
          echo "dmg_path=$DMG_PATH" >> "$GITHUB_OUTPUT"
          echo "checksum_path=$DMG_DIR/$DMG_NAME.sha256" >> "$GITHUB_OUTPUT"
        id: signed_release

      - name: Upload notarized universal DMG and checksum
        uses: actions/upload-artifact@v4
        with:
          name: Siomai-Inventory-${{ github.ref_name }}
          path: |
            ${{ steps.signed_release.outputs.dmg_path }}
            ${{ steps.signed_release.outputs.checksum_path }}
          if-no-files-found: error
          retention-days: 90

      - name: Remove temporary signing material
        if: always()
        shell: bash
        run: |
          [[ -z "${CERTIFICATE_PATH:-}" ]] || rm -f "$CERTIFICATE_PATH"
          [[ -z "${KEYCHAIN_PATH:-}" ]] || security delete-keychain "$KEYCHAIN_PATH" || true
